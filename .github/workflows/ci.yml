name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: trade
          POSTGRES_PASSWORD: trade
          POSTGRES_DB: trade_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trade -d trade_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m compileall -q app modules shared
      - run: pytest -q
      - run: node --check app/web/app.js
      - run: npx --yes prettier@3.6.2 --check 'app/web/*.{js,css,html}'
      - run: docker build -t trade-engine:test .
