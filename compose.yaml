services:
  database:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: trade
      POSTGRES_USER: trade
      POSTGRES_PASSWORD: trade
    volumes:
      - database:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trade -d trade"]
      interval: 5s
      timeout: 3s
      retries: 15
  app:
    build: .
    environment:
      ENVIRONMENT: local
      EXECUTION_MODE: DUMMY
      DATABASE_URL: postgresql://trade:trade@database:5432/trade
      APP_URL: http://localhost:8000
      ALLOWED_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
volumes:
  database:
